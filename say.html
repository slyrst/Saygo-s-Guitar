<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>/say/ – Saygos Fun</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #120000, #000);
    color: #9cff9c;
}

header {
    padding: 12px;
    text-align: center;
    border-bottom: 2px solid #2b0000;
    background: linear-gradient(#100000, #050000);
}

header a {
    color: #3cff3c;
    text-decoration: none;
    border: 1px solid #3cff3c;
    padding: 4px 8px;
    margin-right: 10px;
}

#chat {
    max-width: 900px;
    margin: auto;
    padding: 15px;
    padding-bottom: 120px;
}

.post {
    border-bottom: 1px solid #1f0000;
    padding: 8px 0;
}

.name {
    color: #ff4d4d;
}

.time {
    color: #666;
    font-size: 12px;
}

.message {
    white-space: pre-wrap;
    margin-top: 4px;
}

.post img {
    max-width: 200px;
    display: block;
    margin-top: 5px;
    border: 2px solid #1f0000;
}

form {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #070000;
    border-top: 2px solid #2b0000;
    padding: 10px;
}

input, textarea, button {
    font-family: inherit;
    background: #100000;
    color: #3cff3c;
    border: 1px solid #1f0000;
    padding: 6px;
}

textarea {
    width: 100%;
    height: 60px;
    resize: none;
}

button {
    cursor: pointer;
}

button:hover {
    background: #3cff3c;
    color: #000;
}
</style>
</head>

<body>

<header>
    <a href="index.html">← back</a>
    <strong>/say/</strong> — anon chat
</header>

<div id="chat"></div>

<form id="postForm">
    <textarea id="text" placeholder="say something..."></textarea>
    <input type="file" id="image" accept="image/*">
    <button type="submit">POST</button>
</form>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCVKtkhsShaE5lOk1w4BsAIGb4Y3bqV_OA",
  authDomain: "saygos-fun.firebaseapp.com",
  databaseURL: "https://saygos-fun-default-rtdb.firebaseio.com",
  projectId: "saygos-fun"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
const chatRef = db.ref("say");

const anon = "Anon" + Math.floor(Math.random()*9999);

/* LOAD MESSAGES */
chatRef.limitToLast(100).on("child_added", snap => {
    const data = snap.val();
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
        <div class="name">${data.name} <span class="time">${data.time}</span></div>
        <div class="message">${escapeHTML(data.text || "")}</div>
        ${data.img ? `<img src="${data.img}">` : ""}
    `;

    document.getElementById("chat").appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
});

/* POST */
document.getElementById("postForm").onsubmit = e => {
    e.preventDefault();

    const text = document.getElementById("text").value.trim();
    const file = document.getElementById("image").files[0];

    if (!text && !file) return;

    if (file) {
        const reader = new FileReader();
        reader.onload = () => {
            sendMessage(text, reader.result);
        };
        reader.readAsDataURL(file);
    } else {
        sendMessage(text, "");
    }

    document.getElementById("text").value = "";
    document.getElementById("image").value = "";
};

function sendMessage(text, img) {
    chatRef.push({
        name: anon,
        text,
        img,
        time: new Date().toLocaleString()
    });
}

/* XSS SAFE */
function escapeHTML(str) {
    return str.replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    }[m]));
}
</script>

</body>
</html>
