<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>/say/ – Saygos Fun</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #120000, #000);
    color: #9cff9c;
}

/* HEADER */
header {
    padding: 12px;
    text-align: center;
    border-bottom: 2px solid #2b0000;
    background: linear-gradient(#100000, #050000);
    position: relative;
}

header a {
    color: #3cff3c;
    text-decoration: none;
    border: 1px solid #3cff3c;
    padding: 4px 8px;
    margin-right: 10px;
}

/* ADMIN BUTTON */
#adminBtn {
    position: absolute;
    left: 10px;
    top: 10px;
    font-size: 12px;
    cursor: pointer;
    color: #ff4d4d;
    border: 1px solid #ff4d4d;
    padding: 3px 7px;
}

/* CHAT */
#chat {
    max-width: 900px;
    margin: auto;
    padding: 15px;
    padding-bottom: 150px;
}

.post {
    border-bottom: 1px solid #1f0000;
    padding: 8px 0;
}

.name {
    color: #ff4d4d;
}

.time {
    color: #666;
    font-size: 12px;
}

.message {
    white-space: pre-wrap;
    margin-top: 4px;
    text-align: left;
    color: #9cff9c;
}

/* ADMIN TEXT DISCO */
.admin-message {
    font-weight: bold;
    animation: rainbow 2.5s linear infinite;
}

@keyframes rainbow {
    0% { color: red; }
    16% { color: orange; }
    32% { color: yellow; }
    48% { color: lime; }
    64% { color: cyan; }
    80% { color: magenta; }
    100% { color: red; }
}

.reply-btn {
    font-size: 12px;
    cursor: pointer;
    color: #3cff3c;
    margin-top: 4px;
    display: inline-block;
}

.post img {
    max-width: 200px;
    display: block;
    margin-top: 5px;
    border: 2px solid #1f0000;
}

/* FORM */
form {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #070000;
    border-top: 2px solid #2b0000;
    padding: 10px;
}

textarea {
    width: 100%;
    height: 60px;
    resize: none;
    font-family: inherit;
    background: #100000;
    color: #3cff3c;
    border: 1px solid #1f0000;
}

input, button {
    font-family: inherit;
    background: #100000;
    color: #3cff3c;
    border: 1px solid #1f0000;
    padding: 6px;
}

button:hover {
    background: #3cff3c;
    color: #000;
}
</style>
</head>

<body>

<header>
    <div id="adminBtn">admin sign up</div>
    <a href="index.html">← back</a>
    <strong>/say/</strong> — anon chat
</header>

<div id="chat"></div>

<form id="postForm">
    <textarea id="text" placeholder="say something..."></textarea>
    <input type="file" id="image" accept="image/*">
    <button type="submit">POST</button>
</form>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCVKtkhsShaE5lOk1w4BsAIGb4Y3bqV_OA",
  authDomain: "saygos-fun.firebaseapp.com",
  databaseURL: "https://saygos-fun-default-rtdb.firebaseio.com",
  projectId: "saygos-fun"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const chatRef = db.ref("say");

/* ADMIN SYSTEM */
const ADMIN_PASSWORD = "saygos123"; // CHANGE
let isAdmin = localStorage.getItem("isAdmin") === "true";
let name = isAdmin ? "ADMIN" : "Anon" + Math.floor(Math.random()*9999);

document.getElementById("adminBtn").onclick = () => {
    const pass = prompt("Admin password:");
    if (pass === ADMIN_PASSWORD) {
        localStorage.setItem("isAdmin", "true");
        alert("You are now ADMIN");
        location.reload();
    } else {
        alert("Wrong password");
    }
};

/* SCROLL HELPERS */
function scrollBottom() {
    window.scrollTo(0, document.body.scrollHeight);
}

function isNearBottom() {
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 150;
}

/* LOAD */
let firstLoad = true;

chatRef.limitToLast(100).on("child_added", snap => {
    const d = snap.val();
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
        <div class="name">
            ${d.admin ? "[ADMIN] " : ""}${d.name}
            <span class="time">${d.time}</span>
        </div>
        <div class="message ${d.admin ? "admin-message" : ""}">
            ${escapeHTML(d.text || "")}
        </div>
        ${d.img ? `<img src="${d.img}">` : ""}
        <div class="reply-btn">Reply</div>
    `;

    const shouldScroll = firstLoad || isNearBottom();
    document.getElementById("chat").appendChild(div);

    if (shouldScroll) scrollBottom();
});

/* FORCE BOTTOM ON FIRST LOAD */
setTimeout(() => {
    scrollBottom();
    firstLoad = false;
}, 800);

/* POST */
document.getElementById("postForm").onsubmit = e => {
    e.preventDefault();

    const text = document.getElementById("text").value.trim();
    const file = document.getElementById("image").files[0];
    if (!text && !file) return;

    if (file) {
        const r = new FileReader();
        r.onload = () => send(text, r.result);
        r.readAsDataURL(file);
    } else {
        send(text, "");
    }

    document.getElementById("text").value = "";
    document.getElementById("image").value = "";
};

function send(text, img) {
    chatRef.push({
        name,
        text,
        img,
        admin: isAdmin,
        time: new Date().toLocaleString()
    });
}

/* XSS SAFE */
function escapeHTML(str) {
    return str.replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    }[m]));
}
</script>

</body>
</html>
