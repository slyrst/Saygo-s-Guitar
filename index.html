<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>/soy/ – Saygos Fun</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #200000, #000);
    color: #9cff9c;
    overflow-x: hidden;
}

/* ===== SNOW ===== */
.snowflake {
    position: fixed;
    top: -10px;
    color: white;
    opacity: 0.8;
    pointer-events: none;
    animation: fall linear infinite;
}
@keyframes fall {
    to { transform: translateY(110vh); }
}

/* ===== HEADER ===== */
header {
    text-align: center;
    padding: 20px;
    border-bottom: 2px solid #400;
    background: #100;
}
header h1 {
    margin: 0;
    color: #ff4444;
}
header small {
    color: #33ff33;
}

/* ===== BOARD LINK ===== */
.board-link {
    text-align: center;
    margin: 10px;
}
.board-link button {
    background: #200;
    color: #0f0;
    border: 2px solid #400;
    padding: 6px 12px;
    cursor: pointer;
}

/* ===== CHAT ===== */
#chat {
    max-width: 700px;
    margin: 20px auto;
    background: #050000;
    border: 2px solid #400;
    padding: 10px;
}

#messages {
    height: 350px;
    overflow-y: auto;
    border: 1px solid #300;
    padding: 5px;
}

.msg {
    margin-bottom: 10px;
    padding: 6px;
    background: #0a0000;
    border: 1px solid #300;
}
.msg img {
    max-width: 200px;
    display: block;
    margin-top: 5px;
}

/* ===== INPUTS ===== */
#controls {
    display: flex;
    gap: 5px;
    margin-top: 10px;
}
#controls input[type="text"] {
    flex: 1;
    background: #100;
    color: #0f0;
    border: 1px solid #300;
    padding: 5px;
}
#controls button {
    background: #200;
    color: #0f0;
    border: 1px solid #400;
    cursor: pointer;
}

/* ===== AUDIO ===== */
.audio-controls {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: #100;
    border: 2px solid #400;
    padding: 10px;
}
.audio-controls button {
    background: #200;
    color: #0f0;
    border: 1px solid #400;
}
.audio-controls input {
    width: 80px;
}

/* ===== CRT ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(255,255,255,0.03) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<header>
    <h1>/soy/</h1>
    <small>festive anonymous posting 🎄</small>
</header>

<div class="board-link">
    <button onclick="alert('more boards soon')">/soy/</button>
</div>

<div id="chat">
    <div id="messages"></div>

    <div id="controls">
        <input id="textInput" placeholder="anon post...">
        <input type="file" id="imageInput">
        <button onclick="sendMessage()">POST</button>
    </div>
</div>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="festiveevenings.mp3" type="audio/mpeg">
</audio>

<div class="audio-controls">
    <button id="muteBtn">UNMUTE</button>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
/* ===== FIREBASE CONFIG (REPLACE THIS) ===== */
firebase.initializeApp({
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
});

/* ===== CHAT ===== */
const db = firebase.database().ref("soy");
const storage = firebase.storage();
const messages = document.getElementById("messages");

db.limitToLast(100).on("child_added", snap => {
    const data = snap.val();
    const div = document.createElement("div");
    div.className = "msg";
    if (data.text) div.innerText = data.text;
    if (data.image) {
        const img = document.createElement("img");
        img.src = data.image;
        div.appendChild(img);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

function sendMessage() {
    const text = textInput.value;
    const file = imageInput.files[0];

    if (file) {
        const ref = storage.ref("img/" + Date.now());
        ref.put(file).then(() => {
            ref.getDownloadURL().then(url => {
                db.push({ text, image: url });
            });
        });
    } else {
        db.push({ text });
    }

    textInput.value = "";
    imageInput.value = "";
}

/* ===== AUDIO ===== */
const music = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");
const volume = document.getElementById("volume");

music.volume = 0.5;
document.addEventListener("click", () => music.play(), { once: true });

muteBtn.onclick = () => {
    music.muted = !music.muted;
    muteBtn.textContent = music.muted ? "MUTED" : "UNMUTE";
};
volume.oninput = () => music.volume = volume.value;

/* ===== SNOW ===== */
setInterval(() => {
    const s = document.createElement("div");
    s.className = "snowflake";
    s.textContent = "❄";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = Math.random() * 10 + 10 + "px";
    s.style.animationDuration = Math.random() * 5 + 5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 10000);
}, 200);
</script>

</body>
</html>
