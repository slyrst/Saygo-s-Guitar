<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saygos Fun</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            background: #ffffff;
            border-bottom: 2px solid #ddd;
        }

        header img {
            height: 70px;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            padding: 40px 20px;
            width: 90%;
            max-width: 1000px;
        }

        .game-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
        }

        .game-card img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- 🎵 Background Music -->
    <audio id="bgMusic" autoplay loop>
        <source src="festiveevenings.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <header>
        <img src="logo.png" alt="Saygos Logo">
    </header>

    <div class="games-container">

        <!-- Saygos Guitar Card -->
        <div class="game-card" onclick="window.location.href='saygosguitar.html'">
            <img src="saygosguitar.png" alt="Saygos Guitar">
            <div class="game-title">Saygos Guitar</div>
        </div>

    </div>

    <footer>© 2025 Saygos Fun</footer>

    <!-- Fix autoplay by playing after first click -->
    <script>
        document.body.addEventListener("click", () => {
            const music = document.getElementById("bgMusic");
            music.play();
        }, { once: true });
    </script>

</body>
</html>
