<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>saygosguitar.com.tr</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #0b0b0b, #000);
    color: #ffffff;
    overflow: hidden;
}

/* ===== HEADER ===== */
header {
    position: fixed;
    top: 0;
    width: 100%;
    text-align: center;
    padding: 14px;
    background: rgba(0,0,0,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.2);
    z-index: 10;
}

header .top-text {
    font-size: 18px;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 6px #fff;
}

/* ===== /say/ TEXT ===== */
.say-link {
    position: fixed;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffffff;
    text-decoration: none;
    font-size: 22px;
    border: 2px solid #ffffff;
    padding: 6px 14px;
    transition: 0.2s;
    z-index: 10;
}

.say-link:hover {
    background: #ffffff;
    color: #000;
    box-shadow: 0 0 12px #fff;
}

/* ===== CENTER LOGO (SMALL) ===== */
.center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.center-logo img {
    width: 140px;
    opacity: 0.95;
    filter: drop-shadow(0 0 12px #fff);
}

/* ===== AUDIO CONTROLS ===== */
.audio-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 10px;
    border-radius: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 10;
}

.audio-controls button {
    background: transparent;
    color: #fff;
    border: 1px solid #fff;
    padding: 6px 10px;
    cursor: pointer;
    font-family: inherit;
}

.audio-controls button:hover {
    background: #fff;
    color: #000;
}

.audio-controls input[type="range"] {
    accent-color: white;
    width: 90px;
}

/* ===== SNOW ===== */
.snowflake {
    position: fixed;
    top: -10px;
    color: #ffffff;
    font-size: 14px;
    opacity: 0.9;
    pointer-events: none;
    animation: fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}

/* ===== SOFT GRAIN ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(255,255,255,0.02) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="festiveevenings.mp3" type="audio/mpeg">
</audio>

<header>
    <div class="top-text">saygosguitar.com.tr</div>
</header>

<a class="say-link" href="say.html">/say/</a>

<div class="center-logo">
    <img src="logo.png" alt="Logo">
</div>

<div class="audio-controls">
    <button id="muteBtn">UNMUTE</button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
/* ===== AUDIO ===== */
const music = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volumeSlider");

music.volume = 0.5;

document.body.addEventListener("click", () => {
    music.play();
}, { once: true });

muteBtn.onclick = () => {
    music.muted = !music.muted;
    muteBtn.textContent = music.muted ? "MUTED" : "UNMUTE";
};

volumeSlider.oninput = () => {
    music.volume = volumeSlider.value;
};

/* ===== SNOW ===== */
function spawnSnow() {
    const snow = document.createElement("div");
    snow.className = "snowflake";
    snow.textContent = Math.random() > 0.5 ? "❄" : "✶";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = (Math.random() * 8 + 10) + "px";
    snow.style.animationDuration = (Math.random() * 5 + 6) + "s";
    document.body.appendChild(snow);
    setTimeout(() => snow.remove(), 11000);
}

setInterval(spawnSnow, 160);
</script>

</body>
</html>
