<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>/soy/ festive board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #240000, #000);
    color: #9cff9c;
    overflow-x: hidden;
}

/* SNOW */
.snow {
    position: fixed;
    top: -10px;
    color: white;
    opacity: 0.8;
    pointer-events: none;
    animation: fall linear infinite;
}
@keyframes fall {
    to { transform: translateY(110vh); }
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    border-bottom: 2px solid #400;
    background: #120000;
}
header h1 {
    margin: 0;
    color: #ff3c3c;
}
header small {
    color: #3cff3c;
}

/* CHAT */
#chat {
    max-width: 700px;
    margin: 20px auto;
    background: #080000;
    border: 2px solid #400;
    padding: 10px;
}

#messages {
    height: 350px;
    overflow-y: auto;
    border: 1px solid #300;
    padding: 5px;
}

.msg {
    background: #100;
    border: 1px solid #300;
    padding: 6px;
    margin-bottom: 8px;
}
.msg img {
    max-width: 200px;
    display: block;
    margin-top: 5px;
}

/* INPUTS */
.controls {
    display: flex;
    gap: 5px;
    margin-top: 10px;
}
.controls input[type="text"] {
    flex: 1;
    background: #120000;
    color: #0f0;
    border: 1px solid #400;
    padding: 5px;
}
.controls button {
    background: #200;
    color: #0f0;
    border: 1px solid #400;
    cursor: pointer;
}

/* AUDIO */
.audio {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: #100;
    border: 2px solid #400;
    padding: 10px;
}
.audio button {
    background: #200;
    color: #0f0;
    border: 1px solid #400;
}
.audio input {
    width: 80px;
}

/* CRT */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(255,255,255,0.03) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<header>
    <h1>/soy/</h1>
    <small>anon festive board 🎄</small>
</header>

<div id="chat">
    <div id="messages"></div>
    <div class="controls">
        <input id="text" placeholder="anon post...">
        <input type="file" id="image">
        <button onclick="post()">POST</button>
    </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="festiveevenings.mp3" type="audio/mpeg">
</audio>

<div class="audio">
    <button id="mute">UNMUTE</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.5">
</div>

<!-- FIREBASE (INLINE) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
/* 🔑 PASTE YOUR FIREBASE CONFIG HERE */
firebase.initializeApp({
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  databaseURL: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE"
});

/* CHAT */
const db = firebase.database().ref("soy");
const storage = firebase.storage();
const messages = document.getElementById("messages");

db.limitToLast(100).on("child_added", s => {
    const d = s.val();
    const div = document.createElement("div");
    div.className = "msg";
    if (d.text) div.textContent = d.text;
    if (d.img) {
        const i = document.createElement("img");
        i.src = d.img;
        div.appendChild(i);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

function post() {
    const t = text.value;
    const f = image.files[0];

    if (f) {
        const r = storage.ref("img/" + Date.now());
        r.put(f).then(() => r.getDownloadURL().then(url => {
            db.push({ text: t, img: url });
        }));
    } else {
        db.push({ text: t });
    }

    text.value = "";
    image.value = "";
}

/* MUSIC */
const music = document.getElementById("music");
const mute = document.getElementById("mute");
const vol = document.getElementById("vol");

music.volume = 0.5;
document.addEventListener("click", () => music.play(), { once: true });

mute.onclick = () => {
    music.muted = !music.muted;
    mute.textContent = music.muted ? "MUTED" : "UNMUTE";
};
vol.oninput = () => music.volume = vol.value;

/* SNOW */
setInterval(() => {
    const s = document.createElement("div");
    s.className = "snow";
    s.textContent = "❄";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = Math.random() * 10 + 10 + "px";
    s.style.animationDuration = Math.random() * 5 + 5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 10000);
}, 200);
</script>

</body>
</html>
