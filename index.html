<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Simulator - Access Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #3b1d1d, #1a0f0f);
      color: #f8e4d0;
      text-align: center;
      padding-top: 10%;
    }
    h1 {
      color: #ffb97f;
      font-size: 2em;
    }
    .card {
      background: rgba(40, 20, 10, 0.85);
      border: 2px solid #a7724d;
      border-radius: 15px;
      display: inline-block;
      margin: 20px;
      padding: 25px;
      width: 280px;
      box-shadow: 0 0 10px #000;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    button {
      background-color: #a7724d;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #c18b60;
    }
    input {
      padding: 8px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #a7724d;
      background: #2b1b1b;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎸 Saygo's Guitar Simulator</h1>

  <div class="card">
    <h2>Guitar Simulator Basic</h2>
    <p>Play the free version — no key needed!</p>
    <button onclick="openBasic()">Play Basic</button>
  </div>

  <div class="card">
    <h2>Guitar Simulator +</h2>
    <p>Enter your key to unlock the full version.</p>
    <input type="password" id="keyInput" placeholder="Enter key">
    <br>
    <button onclick="checkKey()">Unlock +</button>
    <p id="message" style="color: #ff8888;"></p>
  </div>

  <script>
    function openBasic() {
      // opens the free version
      window.location.href = "guitar-basic.html"; // your free version file
    }

    function checkKey() {
      const correctKey = "SAYGO-PLUS-2025"; // your secret key
      const userKey = document.getElementById("keyInput").value.trim();
      const message = document.getElementById("message");

      if (userKey === correctKey) {
        message.style.color = "#8eff8e";
        message.textContent = "Access granted!";
        setTimeout(() => {
          window.location.href = "guitar-plus.html"; // your premium version file
        }, 1000);
      } else {
        message.style.color = "#ff8888";
        message.textContent = "Invalid key. Try again.";
      }
    }
  </script>
</body>
</html>
