<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>saygosguitar.com.tr</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #1b0000, #000);
    color: #9cff9c;
    overflow: hidden;
}

/* ===== HEADER (TOP TAB TEXT) ===== */
header {
    position: fixed;
    top: 0;
    width: 100%;
    text-align: center;
    padding: 18px;
    border-bottom: 2px solid #2d0000;
    background: linear-gradient(to bottom, #120000, #050000);
    z-index: 10;
}

header .top-text {
    font-size: 20px;
    color: #ff4d4d;
    text-shadow: 0 0 6px red;
    letter-spacing: 2px;
}

/* ===== CENTER LOGO ===== */
.center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.center-logo img {
    width: 380px;
    max-width: 80vw;
    filter: drop-shadow(0 0 25px red);
}

/* ===== AUDIO CONTROLS ===== */
.audio-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #070000;
    border: 2px solid #2b0000;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    box-shadow: 0 0 20px rgba(255,0,0,0.4);
    z-index: 10;
}

.audio-controls button {
    background: #100000;
    color: #3cff3c;
    border: 2px solid #1f0000;
    padding: 6px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
}

.audio-controls button:hover {
    background: #3cff3c;
    color: #000;
    box-shadow: 0 0 10px green;
}

.audio-controls input[type="range"] {
    accent-color: red;
    width: 90px;
}

/* ===== SNOW ===== */
.snowflake {
    position: fixed;
    top: -10px;
    color: #fff;
    font-size: 14px;
    opacity: 0.85;
    pointer-events: none;
    animation: fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}

/* ===== CRT EFFECT ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(255,255,255,0.03) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="festiveevenings.mp3" type="audio/mpeg">
</audio>

<!-- HEADER TEXT -->
<header>
    <div class="top-text">saygosguitar.com.tr</div>
</header>

<!-- BIG CENTER LOGO -->
<div class="center-logo">
    <img src="logo.png" alt="Saygos Logo">
</div>

<!-- AUDIO UI -->
<div class="audio-controls">
    <button id="muteBtn">UNMUTE</button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
/* ===== AUDIO ===== */
const music = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volumeSlider");

music.volume = 0.5;

document.body.addEventListener("click", () => {
    music.play();
}, { once: true });

muteBtn.onclick = () => {
    music.muted = !music.muted;
    muteBtn.textContent = music.muted ? "MUTED" : "UNMUTE";
};

volumeSlider.oninput = () => {
    music.volume = volumeSlider.value;
};

/* ===== SNOW ===== */
function spawnSnow() {
    const snow = document.createElement("div");
    snow.className = "snowflake";
    snow.textContent = Math.random() > 0.5 ? "❄" : "✶";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = (Math.random() * 10 + 10) + "px";
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
    document.body.appendChild(snow);
    setTimeout(() => snow.remove(), 10000);
}

setInterval(spawnSnow, 180);
</script>

</body>
</html>
