<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saygos Fun</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Courier New", monospace;
    background: radial-gradient(circle at top, #1b0000, #000);
    color: #9cff9c;
    overflow-x: hidden;
}

/* ===== /say/ LINK ===== */
.say-link {
    position: fixed;
    top: 15px;
    right: 20px;
    color: #3cff3c;
    text-decoration: none;
    font-size: 20px;
    border: 2px solid #3cff3c;
    padding: 6px 12px;
    z-index: 9999;
    transition: all 0.2s;
}
.say-link:hover {
    background: #3cff3c;
    color: #000;
    box-shadow: 0 0 10px green;
}

/* ===== SNOW ===== */
.snowflake {
    position: fixed;
    top: -10px;
    color: #fff;
    font-size: 14px;
    opacity: 0.85;
    pointer-events: none;
    animation: fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}

/* ===== HEADER ===== */
header {
    text-align: center;
    padding: 25px;
    border-bottom: 2px solid #2d0000;
    background: linear-gradient(to bottom, #120000, #050000);
}

header img {
    height: 70px;
    filter: drop-shadow(0 0 10px red);
}

/* ===== FESTIVE TEXT ===== */
.subtext {
    margin-top: 10px;
    color: #ff4d4d;
    text-shadow: 0 0 5px red;
}

/* ===== GAMES ===== */
.games-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px;
    padding: 40px;
    max-width: 1000px;
    margin: auto;
}

.game-card {
    background: linear-gradient(145deg, #0a0000, #120000);
    border: 2px solid #1f0000;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.game-card:hover {
    transform: translateY(-6px) rotate(-0.6deg);
    box-shadow:
        0 0 20px rgba(255,0,0,0.3),
        0 0 20px rgba(0,255,0,0.2);
}

.game-card img {
    width: 100%;
    height: 120px;
    object-fit: contain;
    filter: grayscale(1);
}

.game-title {
    margin-top: 10px;
    font-size: 16px;
    color: #3cff3c;
    text-shadow: 0 0 6px green;
}

/* ===== AUDIO CONTROLS ===== */
.audio-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #070000;
    border: 2px solid #2b0000;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    box-shadow: 0 0 20px rgba(255,0,0,0.4);
}

.audio-controls button {
    background: #100000;
    color: #3cff3c;
    border: 2px solid #1f0000;
    padding: 6px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
}

.audio-controls button:hover {
    background: #3cff3c;
    color: #000;
    box-shadow: 0 0 10px green;
}

.audio-controls input[type="range"] {
    accent-color: red;
    width: 90px;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #ff5c5c;
}

/* ===== CRT SCANLINES ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(255,255,255,0.03) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<!-- /say/ LINK -->
<a class="say-link" href="say.html">/say/</a>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="festiveevenings.mp3" type="audio/mpeg">
</audio>

<header>
    <img src="logo.png" alt="Saygos Logo">
    <div class="subtext">happy new year 🎄</div>
</header>

<div class="games-container">
    <div class="game-card" onclick="location.href='saygosguitar.html'">
        <img src="saygosguitar.png">
        <div class="game-title">Saygos Guitar</div>
    </div>
</div>

<footer>
    © 2025 SAYGOS FUN
</footer>

<!-- 🔊 AUDIO UI -->
<div class="audio-controls">
    <button id="muteBtn">UNMUTE</button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
/* ===== AUDIO ===== */
const music = document.getElementById("bgMusic");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.getElementById("volumeSlider");

music.volume = 0.5;

document.body.addEventListener("click", () => {
    music.play();
}, { once: true });

muteBtn.onclick = () => {
    music.muted = !music.muted;
    muteBtn.textContent = music.muted ? "MUTED" : "UNMUTE";
};

volumeSlider.oninput = () => {
    music.volume = volumeSlider.value;
};

/* ===== SNOW ===== */
function spawnSnow() {
    const snow = document.createElement("div");
    snow.className = "snowflake";
    snow.textContent = Math.random() > 0.5 ? "❄" : "✶";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = (Math.random() * 10 + 10) + "px";
    snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
    document.body.appendChild(snow);
    setTimeout(() => snow.remove(), 10000);
}

setInterval(spawnSnow, 180);
</script>

</body>
</html>
